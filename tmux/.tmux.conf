# ~/.tmux.conf

# ~/.tmux.conf - destroy session when last window closes
set -g detach-on-destroy off
# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1              # start windows at 1
set -g pane-base-index 1         # start panes at 1
set -g renumber-windows on       # fill gaps when a window is closed
set -g history-limit 10000       # match your zsh HISTSIZE
set -s escape-time 0             # no delay for escape key (important for nvim)
set -g focus-events on           # lets nvim know when it gains/loses focus

# ── Windows & Panes ───────────────────────────────────────────────────────────
bind t new-window -c "#{pane_current_path}"   # inherit cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane                 # no confirmation prompt
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Navigation ────────────────────────────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Copy mode (vim keys) ───────────────────────────────────────────────────────
set -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# ── Colors ────────────────────────────────────────────────────────────────────
set -g default-terminal "foot"
set -ga terminal-features ",foot:RGB:hyperlinks"

# ── Look (from the theme, below; the window names stay here) ─────────────────
# Windows are named after the program, or the folder while it's just a shell:
#   1 dotfiles  2 nvim  3 claude          ^A kbauer@bauarch │ Thu 12 Nov  14:03
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'
set -g status-interval 5
set -g set-titles on
set -g set-titles-string '#S:#W'

# Status bar position, styles and every colour come from the theme
# (~/dotfiles/theme/templates/tmux.conf, `theme set <name>`).
source-file ~/.config/tmux/theme.conf
