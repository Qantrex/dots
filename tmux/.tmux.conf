# ~/.tmux.conf

# ~/.tmux.conf - destroy session when last window closes
set -g detach-on-destroy off
# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1              # start windows at 1
set -g pane-base-index 1         # start panes at 1
set -g renumber-windows on       # fill gaps when a window is closed
set -g history-limit 10000       # match your zsh HISTSIZE
set -s escape-time 0             # no delay for escape key (important for nvim)
set -g focus-events on           # lets nvim know when it gains/loses focus

# ── Windows & Panes ───────────────────────────────────────────────────────────
bind t new-window -c "#{pane_current_path}"   # inherit cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane                 # no confirmation prompt
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Navigation ────────────────────────────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Copy mode (vim keys) ───────────────────────────────────────────────────────
set -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# ── Colors ────────────────────────────────────────────────────────────────────
set -g default-terminal "foot"
set -ga terminal-overrides ",foot:Tc"

# ── Status bar (true-black monochrome, Rosé Pine Moon pine accent) ──────────
set -g status-position top
set -g status-style "bg=#000000,fg=#ffffff"
set -g window-status-current-style "bg=#3e8fb0,fg=#ffffff,bold"
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#3e8fb0"
set -g status-left "#[fg=#ffffff,bold] #S  "
set -g status-right "#[fg=#888888] %H:%M "
