# ~/.tmux.conf

# ~/.tmux.conf - destroy session when last window closes
set -g detach-on-destroy off
# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1              # start windows at 1
set -g pane-base-index 1         # start panes at 1
set -g renumber-windows on       # fill gaps when a window is closed
set -g history-limit 10000       # match your zsh HISTSIZE
set -s escape-time 0             # no delay for escape key (important for nvim)
set -g focus-events on           # lets nvim know when it gains/loses focus

# ── Windows & Panes ───────────────────────────────────────────────────────────
bind t new-window -c "#{pane_current_path}"   # inherit cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane                 # no confirmation prompt
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Navigation ────────────────────────────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Copy mode (vim keys) ───────────────────────────────────────────────────────
set -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# ── Colors ────────────────────────────────────────────────────────────────────
set -g default-terminal "foot"
set -ga terminal-features ",foot:RGB:hyperlinks"

# ── Look (true-black monochrome, active window like the bar's workspace pill) ─
# Windows are named after the program, or the folder while it's just a shell:
#   1 dotfiles  2 nvim  3 claude          ^A kbauer@bauarch │ Thu 12 Nov  14:03
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'
set -g status-interval 5
set -g set-titles on
set -g set-titles-string '#S:#W'

set -g status-position top
set -g status-justify left
set -g status-style "bg=#000000,fg=#888888"
set -g status-left-length 30
set -g status-right-length 80
# No session name: there is only ever the one session ("0"), so it said nothing.
set -g status-left " "
set -g window-status-format " #[fg=#555555]#I #[fg=#aaaaaa]#W "
set -g window-status-current-format "#[bg=#ffffff,fg=#000000,bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#ffffff,underscore"
set -g window-status-bell-style "fg=#eb6f92"
# ^A lights up while the prefix is pressed, so a half-typed C-a is visible.
set -g status-right "#{?client_prefix,#[bg=#ffffff#,fg=#000000#,bold] ^A #[default] ,}#[fg=#555555]#{user}@#{host_short} #[fg=#333333]│ #[fg=#888888]%a %d %b #[fg=#ffffff,bold] %H:%M "

set -g pane-border-style "fg=#2e2e2e"
set -g pane-active-border-style "fg=#ffffff"
set -g pane-border-indicators both
set -g pane-border-lines single
set -g display-panes-colour "#555555"
set -g display-panes-active-colour "#ffffff"

# Prompts, messages and copy-mode selection (tmux's default here is yellow).
set -g message-style "bg=#000000,fg=#ffffff"
set -g message-command-style "bg=#000000,fg=#aaaaaa"
set -g mode-style "bg=#333333,fg=#ffffff"
set -g copy-mode-match-style "bg=#555555,fg=#ffffff"
set -g copy-mode-current-match-style "bg=#ffffff,fg=#000000"
set -g popup-border-style "fg=#555555"
set -g menu-style "bg=#000000,fg=#aaaaaa"
set -g menu-selected-style "bg=#ffffff,fg=#000000"
set -g menu-border-style "fg=#555555"
set -g clock-mode-colour "#ffffff"
