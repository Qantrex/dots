# yazi -- only what differs from the preset (`yazi --debug` shows the paths).
# Theme: theme.toml, generated by ~/.config/scripts/build-yazi-monochrome.py.

[mgr]
ratio          = [ 1, 3, 4 ]   # more room for the preview
sort_by        = "natural"     # file2 before file10
sort_dir_first = true
linemode       = "size"
show_hidden    = false         # `.` toggles
scrolloff      = 8

[preview]
wrap       = "yes"
max_width  = 1800
max_height = 1800
