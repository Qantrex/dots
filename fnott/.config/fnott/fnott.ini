# ===== fnott.ini — validated keys only (B&W theme) =====
# (See: man fnott.ini)

# ---- placement / stacking ----
# Choose where notifications stack and in what order.
anchor=top-right                 # top-left | top-right | bottom-left | bottom-right
stacking-order=bottom-up         # bottom-up (newest near anchor) | top-down
layer=top                        # background | bottom | top | overlay

# If you want to pin to a specific monitor/output, uncomment and set the name:
# output=DP-1                     # compositor output name; leave unset to let compositor pick

# Margins: distance from screen edges, and between notifications.
edge-margin-vertical=24
edge-margin-horizontal=24
notification-margin=10

# ---- icons / visuals ----
icon-theme=hicolor
max-icon-size=28

# ---- typography & colors (global defaults) ----
# Fontconfig syntax, e.g. "JetBrainsMono:size=11"
title-font=sans-serif:size=11
summary-font=sans-serif:size=11
body-font=sans-serif:size=11

# Pure black background, white text. Thin white border.
background=000000ff
title-color=ffffffff
summary-color=ffffffff
body-color=ffffffff
border-color=ffffffff
border-size=1

# Progress bar styling (still monochrome)
progress-bar-height=6
progress-bar-color=ffffffff

# DPI handling: auto | yes | no  (auto works well on mixed-DPI setups)
dpi-aware=true

# ---- timeouts & sound ----
# default/max: seconds; 0 = disabled
default-timeout=6
max-timeout=0
idle-timeout=0

# Optional sound on new notifications (set a valid absolute file path).
# sound-file=/usr/share/sounds/freedesktop/stereo/message.oga

# If you want to *play* hint-provided sounds, define a command (uses ${filename}).
# play-sound=aplay ${filename}

# If no icon is provided by the app, you can set a fallback:
# icon=dialog-information

# ================= per-urgency overrides =================
# These sections override the “Per-urgency default options” list from the man page.

[low]
# Slightly lifted background, still monochrome.
background=0a0a0aff
title-color=ccccccff
summary-color=ccccccff
body-color=ccccccff
border-color=ffffffff
border-size=1
default-timeout=4

[normal]
# Inherit most from global; explicitly restate border for clarity.
background=000000ff
title-color=ffffffff
summary-color=ffffffff
body-color=ffffffff
border-color=ffffffff
border-size=1
default-timeout=6

[critical]
# Invert for maximum contrast while staying B&W.
background=ffffffff
title-color=000000ff
summary-color=000000ff
body-color=000000ff
border-color=ffffffff
border-size=1
# Keep visible until you act (unless max-timeout caps it).
default-timeout=0
