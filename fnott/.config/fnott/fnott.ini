# ~/.config/fnott/fnott.ini
# Pretty, glassy style with rounded corners + accent border
# Colors are RGBA as 8-digit hex: RRGGBBAA

[main]  # (aka the unnamed default section)
# --- placement / layout ---
anchor = top-right
stacking-order = bottom-up
edge-margin-vertical = 18
edge-margin-horizontal = 18
notification-margin = 12
min-width = 340
max-width = 420
max-height = 260

# --- icons / scaling ---
icon-theme = Papirus-Dark
max-icon-size = 56
scaling-filter = lanczos3

# --- typography ---
dpi-aware = yes
title-font   = JetBrainsMono Nerd Font:size=9:weight=500
summary-font = JetBrainsMono Nerd Font:size=11:weight=700
body-font    = JetBrainsMono Nerd Font:size=10

# --- shared visuals (base for all urgencies) ---
border-radius = 16
border-size = 1
padding-vertical = 14
padding-horizontal = 16
progress-bar-height = 6
progress-style = background
progress-color = a855f7ff      # accent for progress

# --- default (normal) colors ---
background   = 0f0f12cc        # glassy charcoal (80% opacity)
border-color = a855f736        # subtle purple accent border
title-color  = f2f2f5ff
summary-color= ffffffff
body-color   = e7e7ecff

[low]
# Desaturated, a bit more transparent
background   = 0f0f12b3
title-color  = c0c4cfff
summary-color= c0c4cfff
body-color   = c0c4cfff
border-color = a855f724

[normal]
# Slightly stronger border on normal notices
border-color = a855f752

[critical]
# Warm critical tint with strong border
background   = 6c3333f2
border-color = ff5a5aff
title-color  = ffffffff
summary-color= ffffffff
body-color   = fef2f2ff
