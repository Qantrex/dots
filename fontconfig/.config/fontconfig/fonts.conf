<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Generic families match the desktop: GTK already uses Adwaita Sans, the terminal Iosevka Term.
     Without this, Qt, Electron, Chrome, Java and LibreOffice fell back to Noto Sans and Noto Sans Mono. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Adwaita Sans</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>IosevkaTerm Nerd Font Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
