# mpv -- on-screen text in the terminal font, greys on black.
keep-open = yes                 # stay on the last frame instead of closing
background-color = "#000000"
osd-font = "IosevkaTerm Nerd Font Mono"
osd-font-size = 30
osd-color = "#e0e0e0"
osd-border-color = "#000000"
osd-border-size = 2
osd-bar-h = 2
osd-bar-align-y = 0.95
sub-font = "IosevkaTerm Nerd Font Mono"
sub-color = "#ffffff"
sub-border-color = "#000000"
screenshot-directory = "~/Pictures/Screenshots"
screenshot-template = "mpv-%F-%P"
