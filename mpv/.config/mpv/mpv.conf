# mpv -- on-screen text font and colours come from the theme (theme.conf links to
# ~/dotfiles/theme/current/mpv.conf).
include = "~~/theme.conf"
keep-open = yes                 # stay on the last frame instead of closing
hwdec = auto-safe               # hardware video decoding (VA-API on the AMD iGPU)
osd-font-size = 30
osd-border-size = 2
osd-bar-h = 2
osd-bar-align-y = 0.95
screenshot-directory = "~/Pictures/Screenshots"
screenshot-template = "mpv-%F-%P"
