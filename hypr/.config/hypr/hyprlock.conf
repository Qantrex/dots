# hyprlock
# https://wiki.hypr.land/hypr-ecosystem/hyprlock/
#
# hyprlock is a separate program and still uses hyprlang -- only Hyprland
# itself moved to Lua.
#
# Looks like a TTY session on pure black: a getty header, then a short shell
# transcript (date, uptime, vlock) and a login prompt, all in Iosevka Term
# (ttf-iosevkaterm-nerd), the terminal's font.
#
# Units are PHYSICAL pixels: hyprlock ignores the monitor scale, so on the
# laptop (2880x1800, scale 2) 28 pt looks like 14 pt. Rows are 50 px apart.
# Text sizes are Pango points (1 pt = 4/3 px) and Iosevka Term glyphs are
# 0.5 em wide, so one character is 28 * 4/3 * 0.5 = ~18.7 px. That is what
# places the password field after "Password: " -- so it needs that font
# installed; with a fallback font the stars overlap the label.

$font   = IosevkaTerm Nerd Font Mono
$fg     = rgb(224, 224, 224)
$grey   = rgb(150, 150, 150)
$dim    = rgb(95, 95, 95)
$love   = rgb(235, 111, 146)
$size   = 28
$x      = 128

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fingerprint unlock runs next to the password field. Needs libfprint-elanpress-git
# on the laptop's ELAN 04f3:0c6e reader; press firmly.
auth {
    fingerprint {
        enabled = true
        ready_message = place a finger on the reader
        present_message = scanning...
    }
}

# Solid black.
#
# The old config had `path = #000000`, which looks like it sets a colour but
# does not: `#` starts a comment in hyprlang, so `path` was simply empty. It
# happened to work because an empty path falls back to `color`.
background {
    color = rgb(0, 0, 0)
}

# ------------------------------------------------------------ getty header

label {
    text = cmd[update:0] printf 'Arch Linux %s (tty1)' "$(uname -r)"
    color = $dim
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -120
}

# ------------------------------------------------------------ transcript
# Prompt in Arch's default bash style.

label {
    text = cmd[update:0] printf '[%s@%s ~]$ date' "$USER" "$(cat /etc/hostname)"
    color = $fg
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -220
}

# Date and time in one label, like real `date` output with seconds. One label
# so it can't overlap whatever the font's width is; costs a `date` per second
# while locked.
label {
    text = cmd[update:1000] date '+%a %d %b %Y  %H:%M:%S' | tr '[:upper:]' '[:lower:]'
    color = $grey
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -270
}

label {
    text = cmd[update:0] printf '[%s@%s ~]$ uptime -p' "$USER" "$(cat /etc/hostname)"
    color = $fg
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -320
}

label {
    text = cmd[update:60000] uptime -p
    color = $grey
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -370
}

label {
    text = cmd[update:0] printf '[%s@%s ~]$ vlock' "$USER" "$(cat /etc/hostname)"
    color = $fg
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -420
}

# Runs once when the lock starts, so it keeps the time of locking.
label {
    text = cmd[update:0] printf 'This TTY is now locked (since %s).' "$(date +%H:%M)"
    color = $grey
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -470
}

# ------------------------------------------------------------ login prompt

label {
    text = cmd[update:0] printf '%s login: %s' "$(cat /etc/hostname)" "$USER"
    color = $fg
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -570
}

label {
    text = Password:
    color = $fg
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -620
}

# The field itself is invisible: no box, no outline, the dots are "*" in the
# same font and size, left-aligned, so it reads as a shell password prompt.
# Messages that would be centred inside the box go to the labels below.
input-field {
    size = 900, 56
    halign = left
    valign = top
    # $x + 10 chars ("Password: ") minus the field's ~5 px left padding;
    # 3 px higher than the label because the field is taller than a text row.
    position = 310, -616

    outline_thickness = 0
    rounding = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    fail_color  = rgba(0, 0, 0, 0)
    font_color  = $fg
    font_family = $font

    dots_text_format = *
    # Field height 56 * 0.5 -> the "*" is drawn at 28 pt, like the text.
    dots_size = 0.5
    dots_spacing = 0
    dots_center = false
    fade_on_empty = false

    placeholder_text = <span foreground="##000000">.</span>
    fail_text = <span foreground="##000000">.</span>
    fail_timeout = 4000
}

# PAM's message after a wrong password ("Authentication failed"), in red like
# a failed `login`.
label {
    text = $FAIL
    color = $love
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -670
}

label {
    text = $FPRINTPROMPT
    color = $dim
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -720
}
