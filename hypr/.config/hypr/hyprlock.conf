# hyprlock
# https://wiki.hypr.land/hypr-ecosystem/hyprlock/
#
# hyprlock is a separate program and still uses hyprlang -- only Hyprland
# itself moved to Lua.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Solid black.
#
# The old config had `path = #000000`, which looks like it sets a colour but
# does not: `#` starts a comment in hyprlang, so `path` was simply empty. It
# happened to work because an empty path falls back to `color`.
background {
    color = rgb(0, 0, 0)
}

input-field {
    size = 300, 70
    halign = center
    valign = center
    position = 0, 0

    outer_color = rgb(50, 50, 50)
    inner_color = rgba(25, 25, 25, 0.5)
    font_color  = rgb(255, 255, 255)

    outline_thickness = 4
    rounding = 15

    dots_size = 0.5
    dots_spacing = 0.25
    dots_rounding = -1
    fade_on_empty = false

    placeholder_text = <span font_family="JetBrainsMono Nerd Font" foreground="##888888">Enter Password</span>
    fail_text = <span font_family="JetBrainsMono Nerd Font" foreground="##ff4444">$FAIL (attempt $ATTEMPTS)</span>
    fail_transition = 300
}

# Clock. $TIME is built in, so this no longer forks `date` once a second.
label {
    text = $TIME
    halign = center
    valign = center
    position = 0, -200
    color = rgb(255, 255, 255)
    font_size = 60
    font_family = JetBrainsMono Nerd Font
}

# Date. No built-in variable for this, so it still shells out -- but once a
# minute instead of once a second.
label {
    text = cmd[update:60000] date '+%A, %B %d'
    halign = center
    valign = center
    position = 0, -140
    color = rgb(255, 255, 255)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
}
