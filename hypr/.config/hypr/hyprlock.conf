# hyprlock
# https://wiki.hypr.land/hypr-ecosystem/hyprlock/
#
# hyprlock is a separate program and still uses hyprlang -- only Hyprland
# itself moved to Lua.
#
# A plain lock on pure black: a large clock, the date, one password field.
# Nothing imitates a terminal (until 2026-11-15 it faked a getty login with a
# shell transcript). Greys are the desktop's ladder: text #e6e6e6, secondary
# #b3b3b3, dim #808080, lines #2e2e2e; love only for a wrong password.
#
# Units are PHYSICAL pixels and text sizes Pango points: hyprlock ignores the
# monitor scale, so on the laptop (2880x1800, scale 2) everything looks half
# the size written here.
$font   = IosevkaTerm Nerd Font Mono
$fg     = rgb(230, 230, 230)
$muted  = rgb(179, 179, 179)
$dim    = rgb(128, 128, 128)
$love   = rgb(235, 111, 146)

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fingerprint unlock keeps running next to the password field, but the screen
# doesn't advertise it: the laptop's ELAN reader fails more often than not.
auth {
    fingerprint {
        enabled = true
    }
}

background {
    color = rgb(0, 0, 0)
}

# Clock
label {
    text = $TIME
    color = $fg
    font_size = 120
    font_family = $font
    halign = center
    valign = center
    position = 0, 230
}

# Date
label {
    text = cmd[update:60000] date '+%A, %-d %B'
    color = $muted
    font_size = 26
    font_family = $font
    halign = center
    valign = center
    position = 0, 90
}

# Password: a thin outlined field, dots in the text colour. A wrong password
# turns the outline love and shows PAM's message in the field.
input-field {
    size = 720, 64
    halign = center
    valign = center
    position = 0, -60

    outline_thickness = 2
    rounding = 8
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(255, 255, 255, 0.18)
    check_color = rgba(255, 255, 255, 0.45)
    fail_color  = $love
    font_color  = $fg
    font_family = $font

    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="##808080">password</span>
    fail_text = <span foreground="##eb6f92">$FAIL</span>
}
