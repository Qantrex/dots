# A simple background with a solid black color.
background {
    path = #000000
    color = rgb(0, 0, 0)
}

# The password input field.
input-field {
	
	fade_on_empty = false

    # Size and position of the input box
    size = 300, 70
    halign = center
    valign = center
    position = 0, 0

    # Colors
    outer_color = rgb(50, 50, 50)      # Border color
    inner_color = rgba(25, 25, 25, 0.5) # Background color with 50% transparency
    font_color = rgb(255, 255, 255)    # Color of the password dots

    # Border and rounding
    outline_thickness = 4            # Thickness of the border
    rounding = 15                  # Rounded corners on the input box
    
    # Password dots
    dots_size = 0.5                  # Larger dots
    dots_spacing = 0.25              # More space between dots
    dots_rounding = -1               # Circular dots

    # Text and placeholder
    placeholder_text = <span font_family="JetBrainsMono Nerd Font" foreground="##888888">Enter Password</span>
    fail_text = <span font_family="JetBrainsMono Nerd Font" foreground="##ff4444">Wrong Password!</span>
    fail_transition = 300
}

# An optional label for the date and time.
label {
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    halign = center
    valign = center
    position = 0, -200
    color = rgb(255, 255, 255)
    font_size = 60
    font_family = JetBrainsMono Nerd Font
}

# An optional label for the date.
label {
    text = cmd[update:1000] echo "$(date '+%A, %B %d')"
    halign = center
    valign = center
    position = 0, -140
    color = rgb(255, 255, 255)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
}
