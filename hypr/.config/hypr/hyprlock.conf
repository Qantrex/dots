# hyprlock
# https://wiki.hypr.land/hypr-ecosystem/hyprlock/
#
# hyprlock is a separate program and still uses hyprlang -- only Hyprland
# itself moved to Lua.
#
# Looks like a TTY login on pure black: a getty header and a login prompt top
# left, a big clock bottom right. Font: Iosevka Term (ttf-iosevkaterm-nerd),
# the terminal's font.
#
# Text sizes are Pango points (1 pt = 4/3 px); Iosevka Term glyphs are 0.5 em
# wide. That is what places the password field right after "Password: ":
# 10 chars * 0.5 * 16pt * 4/3 = ~107 px.

$font   = IosevkaTerm Nerd Font Mono
$fg     = rgb(224, 224, 224)
$dim    = rgb(110, 110, 110)
$faint  = rgb(60, 60, 60)
$love   = rgb(235, 111, 146)
$x      = 64
$size   = 16

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fingerprint unlock runs next to the password field. Needs libfprint-elanpress-git
# on the laptop's ELAN 04f3:0c6e reader; press firmly.
auth {
    fingerprint {
        enabled = true
        ready_message = place a finger on the reader
        present_message = scanning...
    }
}

# Solid black.
#
# The old config had `path = #000000`, which looks like it sets a colour but
# does not: `#` starts a comment in hyprlang, so `path` was simply empty. It
# happened to work because an empty path falls back to `color`.
background {
    color = rgb(0, 0, 0)
}

# ------------------------------------------------------------ getty header

label {
    text = cmd[update:0] printf 'Arch Linux %s (%s) (tty1)' "$(uname -r)" "$(cat /etc/hostname)"
    color = $dim
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -60
}

label {
    text = cmd[update:60000] printf 'locked %s  ·  up %s' "$(date +%H:%M)" "$(uptime -p | sed 's/^up //; s/ hours\?/h/; s/ minutes\?/m/; s/ days\?/d/g; s/,//g')"
    color = $faint
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -88
}

# ------------------------------------------------------------ login prompt

label {
    text = cmd[update:0] printf '%s login: %s' "$(cat /etc/hostname)" "$USER"
    color = $fg
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -150
}

label {
    text = Password:
    color = $fg
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -178
}

# The field itself is invisible: no box, no outline, the dots are "*" in the
# same font, left-aligned, so it reads as a shell password prompt. Messages
# that would be centred inside the box go to the label below instead.
input-field {
    size = 520, 34
    halign = left
    valign = top
    # $x + ~107 px for "Password: ", minus the field's own left padding.
    position = 168, -172

    outline_thickness = 0
    rounding = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    fail_color  = rgba(0, 0, 0, 0)
    font_color  = $fg
    font_family = $font

    dots_text_format = *
    dots_size = 0.47
    dots_spacing = 0
    dots_center = false
    fade_on_empty = false

    placeholder_text = <span foreground="##000000">.</span>
    fail_text = <span foreground="##000000">.</span>
    fail_timeout = 4000
}

# PAM's message after a wrong password ("Authentication failed"), in red like
# a failed `login`.
label {
    text = $FAIL
    color = $love
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -222
}

label {
    text = $FPRINTPROMPT
    color = $dim
    font_size = $size
    font_family = $font
    halign = left
    valign = top
    position = $x, -250
}

# ------------------------------------------------------------ clock

# $TIME is built in, so this does not fork `date` once a second.
label {
    text = $TIME
    color = $fg
    font_size = 72
    font_family = $font
    halign = right
    valign = bottom
    position = -64, 92
}

# No built-in variable for the date, so it shells out -- once a minute.
label {
    text = cmd[update:60000] date '+%A %d %B' | tr '[:upper:]' '[:lower:]'
    color = $dim
    font_size = $size
    font_family = $font
    halign = right
    valign = bottom
    position = -64, 60
}
