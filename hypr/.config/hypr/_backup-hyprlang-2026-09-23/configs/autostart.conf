#################
### AUTOSTART ###
#################

# Terminal on ws 1
exec-once = [workspace 1 silent]  foot

# Browser on ws 2
exec-once = [workspace 2 silent]  firefox

# Spotify on ws 9
exec-once = [workspace 9 silent] spotify-adblock

# Vesktop on ws 10
exec-once = [workspace 10 silent] vesktop  --enable-features=WaylandWindowDecorations --ozone-platform-hint=auto %U

# ...the rest of your autostart from earlier...
exec-once = waybar
exec-once = hyprpaper -c ~/.config/hypr/hyprpaper.conf
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swayidle -w timeout 300 'hyprlock' before-sleep 'hyprlock' lock 'hyprlock'
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = batsignal
exec-once = swayosd-server
exec-once = mako
