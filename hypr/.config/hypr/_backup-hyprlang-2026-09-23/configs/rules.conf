##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Rules are evaluated top-to-bottom. :contentReference[oaicite:3]{index=3}

# Example windowrule (v0.53+):
# windowrule = match:class ^(kitty)$, match:title ^(kitty)$, float on

# Ignore maximize requests from apps. You'll probably like this.
# Old: windowrule = suppressevent maximize, class:.*
windowrule = match:class .*, suppress_event maximize

# Fix some dragging / focus-steal issues with XWayland “ghost”/utility windows
# Old:
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
#
# v0.53 approach:
# - block initial focus
# - additionally suppress activation requests (common culprit for focus stealing)
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_initial_focus on, suppress_event activate activatefocus

# Optional QOL (nice but optional):
# Old:
# windowrulev2 = tile,        class:^(vesktop|Vesktop)$   # ensure tiled, not floating
# windowrulev2 = opacity 1.0 1.0, class:^(vesktop|Vesktop)$
#
# New:
# windowrule = match:class ^(vesktop|Vesktop)$, tile on
# windowrule = match:class ^(vesktop|Vesktop)$, opacity 1.0 1.0

# Auto-move Vesktop / Discord to workspace 10
# Old: windowrulev2 = workspace 10, class:^(Vesktop)$
windowrule = match:class ^(Vesktop)$, workspace 10
windowrule = match:class ^(Discord)$, workspace 10

# Auto-move Spotify to workspace 9
windowrule = match:class ^(Spotify)$, workspace 9

# Layer rules (v0.53+ uses match:namespace and ignore_alpha) :contentReference[oaicite:4]{index=4}
# Old:
# layerrule = blur, notifications
# layerrule = ignorealpha 0.15, notifications
# layerrule = xray 1, notifications
layerrule = match:namespace notifications, blur on
layerrule = match:namespace notifications, ignore_alpha 0.15
layerrule = match:namespace notifications, xray 1
