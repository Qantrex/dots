#################
### AUTOSTART ###
#################

# Terminal on ws 1
exec-once = sh -c 'hyprctl dispatch workspace 1; foot'

# Browser on ws 2
exec-once = sh -c 'hyprctl dispatch workspace 2; firefox'

# Vesktop on ws 10
exec-once = sh -c 'hyprctl dispatch workspace 10; vesktop'

# ...the rest of your autostart from earlier...
exec-once = waybar
exec-once = hyprpaper -c ~/.config/hypr/hyprpaper.conf
exec-once = fnott
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swayidle -w timeout 300 'hyprlock' before-sleep 'hyprlock' lock 'hyprlock'
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = batsignal
