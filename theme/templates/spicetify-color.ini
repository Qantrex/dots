; spicetify-color.ini of the {{ theme }} theme. GENERATED by `theme` from
; ~/dotfiles/theme/templates/spicetify-color.ini; edit that and run `theme apply`.
; COLOR EXPLANATION
; main, sidebar, player = background
; card                  = cards, tracklist, dropdowns, input fields
; shadow                = text on button, tab active & selected row
; selected row          = selected song & tab
; button-active         = play button, outline on focused input
; button                = all other buttons
; button-disabled       = volume & seekbar background, scrollbar handle, borders, hover

[theme]
text               = {{ (fg).hex }}
subtext            = {{ (tone(0x99)).hex }}
main               = {{ (bg).hex }}
main-elevated      = {{ (tone(0x0a)).hex }}
sidebar            = {{ (bg).hex }}
player             = {{ (bg).hex }}
card               = {{ (tone(0x11)).hex }}
shadow             = {{ (on_accent).hex }}
selected-row       = {{ (accent).hex }}
button             = {{ (accent).hex }}
button-active      = {{ (mix(on_accent, accent, 0xcc/255)).hex }}
button-disabled    = {{ (tone(0x33)).hex }}
tab-active         = {{ (tone(0x22)).hex }}
notification       = {{ (tone(0x11)).hex }}
notification-error = {{ (love).hex }}
misc               = {{ (bg).hex }}
highlight          = {{ (tone(0x1a)).hex }}
highlight-elevated = {{ (tone(0x22)).hex }}
