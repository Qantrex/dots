# GTK 3 and 4 settings of the {{ theme }} theme. GENERATED by `theme` from
# ~/dotfiles/theme/templates/gtk-settings.ini; edit that and run `theme apply`.
# On Wayland most GTK apps read gsettings instead, which `theme` sets as well.
[Settings]
gtk-theme-name={{ asset.gtk_theme or "Current" }}
gtk-icon-theme-name={{ asset.icon_theme }}
gtk-cursor-theme-name={{ asset.cursor_theme }}
gtk-cursor-theme-size={{ asset.cursor_size }}
gtk-application-prefer-dark-theme={{ 1 if dark else 0 }}
