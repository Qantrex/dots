# foot: font and colours of the {{ theme }} theme. GENERATED by `theme` from
# ~/dotfiles/theme/templates/foot.ini; edit that and run `theme apply`.
[main]
# Iosevka Term (pacman: ttf-iosevkaterm-nerd). Narrow, so 13 here is about as
# tall as other fonts at 12 while fitting more columns.
font={{ font.mono }}:size={{ font.mono_size }}

# The theme's 16 terminal colours. In root: greys on true black, only red, yellow
# and magenta keep Rosé Pine Moon colours (love, gold, iris); every other slot is
# a grey, readable at 4.9:1 or better except slot 0, so untuned tools stop showing
# blue and teal.
[colors-dark]
alpha={{ look.terminal_alpha }}
background={{ bg.hex }}
foreground={{ text.hex }}
regular0={{ term.black.hex }}
regular1={{ term.red.hex }}
regular2={{ term.green.hex }}
regular3={{ term.yellow.hex }}
regular4={{ term.blue.hex }}
regular5={{ term.magenta.hex }}
regular6={{ term.cyan.hex }}
regular7={{ term.white.hex }}
bright0={{ term.bright_black.hex }}
bright1={{ term.bright_red.hex }}
bright2={{ term.bright_green.hex }}
bright3={{ term.bright_yellow.hex }}
bright4={{ term.bright_blue.hex }}
bright5={{ term.bright_magenta.hex }}
bright6={{ term.bright_cyan.hex }}
bright7={{ term.bright_white.hex }}
urls={{ iris.hex }}
flash={{ gold.hex }}
cursor={{ on_accent.hex }} {{ accent.hex }}
