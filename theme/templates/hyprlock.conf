# hyprlock: the lock screen of the {{ theme }} theme. GENERATED by `theme` from
# ~/dotfiles/theme/templates/hyprlock.conf; edit that and run `theme apply`.
#
# The layout belongs to the wallpaper (the password sits between the fingers), so a
# theme with another wallpaper brings its own copy in themes/<name>/templates/.
# https://wiki.hypr.land/hypr-ecosystem/hyprlock/
#
# hyprlock is a separate program and still uses hyprlang -- only Hyprland
# itself moved to Lua.
#
# The desktop's own picture: the ASCII "Creation of Adam" wallpaper, dimmed, with
# the password typed into the gap between the two fingers -- the one part of the
# image that means something (the moment just before the touch). The clock sits in
# the empty black above. Nothing imitates a terminal (until 2026-11-15 this faked
# a getty login with a shell transcript).
# Positions are measured for the laptop (16:10, the 16:9 image cropped at the
# sides); on the desktop's 16:9 screens the gap lands within a few pixels.
$font   = {{ font.mono }}
$fg     = rgb({{ text.dec }})
$muted  = rgb({{ tone(0xb3).dec }})
$dim    = rgb({{ tone(0x80).dec }})
$love   = rgb({{ love.dec }})

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fingerprint unlock keeps running next to the password field, but the screen
# doesn't advertise it: the laptop's ELAN reader fails more often than not.
auth {
    fingerprint {
        enabled = true
    }
}

background {
    path = {{ asset.wallpaper }}
    color = rgb({{ bg.dec }})
    brightness = 0.55
    blur_passes = 0
}

# Clock
label {
    text = $TIME
    color = $fg
    font_size = 120
    font_family = $font
    halign = center
    valign = center
    position = 0, 560
}

# Date
label {
    text = cmd[update:60000] date '+%A, %-d %B'
    color = $muted
    font_size = 26
    font_family = $font
    halign = center
    valign = center
    position = 0, 430
}

# Password: no box, only the dots, centred in the gap between the fingertips.
input-field {
    size = 520, 60
    halign = center
    valign = center
    position = -56, -36

    outline_thickness = 0
    inner_color = rgba({{ bg.dec }}, 0)
    outer_color = rgba({{ bg.dec }}, 0)
    check_color = rgba({{ bg.dec }}, 0)
    fail_color  = rgba({{ bg.dec }}, 0)
    font_color  = $fg
    font_family = $font

    dots_size = 0.24
    dots_spacing = 0.5
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="##00000000">.</span>
    fail_text = <span foreground="##00000000">.</span>
}

# A wrong password: PAM's message in love, under the hands.
label {
    text = $FAIL
    color = $love
    font_size = 20
    font_family = $font
    halign = center
    valign = center
    position = 0, -470
}
