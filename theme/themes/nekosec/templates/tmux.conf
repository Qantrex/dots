# tmux.conf of the {{ theme }} theme. GENERATED by `theme` from
# ~/dotfiles/theme/themes/nekosec/templates/tmux.conf
# (a copy of templates/tmux.conf: a kaomoji instead of user@host, hearts as separators); edit that and run `theme apply`.
# Sourced by ~/.tmux.conf. The status bar on top, the active window like the
# bar's workspace pill.

set -g status-position top
set -g status-justify left
set -g status-style "bg={{ bg }},fg={{ tone(0x88) }}"
set -g status-left-length 30
set -g status-right-length 80
# No session name: there is only ever the one session ("0"), so it said nothing.
set -g status-left " "
set -g window-status-format " #[fg={{ tone(0x55) }}]#I #[fg={{ tone(0xaa) }}]#W "
set -g window-status-current-format "#[bg={{ accent }},fg={{ on_accent }},bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg={{ fg }},underscore"
set -g window-status-bell-style "fg={{ love }}"
# ^A lights up while the prefix is pressed, so a half-typed C-a is visible.
set -g status-right "#{?client_prefix,#[bg={{ accent }}#,fg={{ on_accent }}#,bold] ^A #[default] ,}#[fg={{ accent }}](=^･ω･^=) #[fg={{ lilac }}]♡ #[fg={{ tone(0x88) }}]%a %d %b #[fg={{ fg }},bold] %H:%M "

set -g pane-border-style "fg={{ tone(0x2e) }}"
set -g pane-active-border-style "fg={{ fg }}"
set -g pane-border-indicators both
set -g pane-border-lines single
set -g display-panes-colour "{{ tone(0x55) }}"
set -g display-panes-active-colour "{{ fg }}"

# Prompts, messages and copy-mode selection (tmux's default here is yellow).
set -g message-style "bg={{ bg }},fg={{ fg }}"
set -g message-command-style "bg={{ bg }},fg={{ tone(0xaa) }}"
set -g mode-style "bg={{ tone(0x33) }},fg={{ fg }}"
set -g copy-mode-match-style "bg={{ tone(0x55) }},fg={{ fg }}"
set -g copy-mode-current-match-style "bg={{ accent }},fg={{ on_accent }}"
set -g popup-border-style "fg={{ tone(0x55) }}"
set -g menu-style "bg={{ bg }},fg={{ tone(0xaa) }}"
set -g menu-selected-style "bg={{ accent }},fg={{ on_accent }}"
set -g menu-border-style "fg={{ tone(0x55) }}"
set -g clock-mode-colour "{{ fg }}"
