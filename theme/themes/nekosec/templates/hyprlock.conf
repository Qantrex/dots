# hyprlock: the lock screen of the {{ theme }} theme. GENERATED by `theme` from
# ~/dotfiles/theme/themes/nekosec/templates/hyprlock.conf; edit that and run `theme apply`.
# https://wiki.hypr.land/hypr-ecosystem/hyprlock/
#
# Belongs to ../wallpaper.svg: the seeing stone sits at the exact centre of the
# image, so the passphrase is typed into the cat's eye at position 0, 0 on any
# screen. The clock fills the empty band above the ears, the "access denied"
# line sits under the text arcs. Positions are pixels from the centre, measured
# on the laptop's 2880x1800 panel.
# Label text is Pango markup inside hyprlang: escape < > & and double every #.
$font  = {{ font.shell }}
$mono  = {{ font.mono }}
$fg    = rgb({{ fg.dec }})
$pink  = rgb({{ accent.dec }})
$lilac = rgb({{ lilac.dec }})
$mint  = rgb({{ mint.dec }})
$love  = rgb({{ love.dec }})

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
    }
}

background {
    path = {{ asset.wallpaper }}
    color = rgb({{ bg.dec }})
    brightness = 0.8
    blur_passes = 0
}

# Clock, in the empty band above the ears
label {
    text = $TIME
    color = $fg
    font_size = 110
    font_family = $font
    halign = center
    valign = center
    position = 0, 680
}

label {
    text = cmd[update:60000] date '+%A, %-d %B' | tr '[:upper:]' '[:lower:]'
    color = $mint
    font_size = 24
    font_family = $font
    halign = center
    valign = center
    position = 0, 565
}

# The passphrase goes into the eye: pink dots across the slit pupil.
input-field {
    size = 320, 60
    halign = center
    valign = center
    position = 0, 0

    outline_thickness = 0
    inner_color = rgba({{ bg.dec }}, 0)
    outer_color = rgba({{ bg.dec }}, 0)
    check_color = rgba({{ bg.dec }}, 0)
    fail_color  = rgba({{ bg.dec }}, 0)
    font_color  = $pink
    font_family = $mono

    dots_size = 0.26
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="##{{ lilac.hex }}">passphrase, nya?</span>
    fail_text = <span foreground="##{{ love.hex }}">nope</span>
}

# The last safe picture the daemon showed, as a framed portrait left of the stone
# (~/.cache/nekosec/portrait.png; neko writes it only from pictures rated safe,
# whatever its mode). Missing on a fresh install until the first picture.
image {
    path = {{ home }}/.cache/nekosec/portrait.png
    size = 400
    rounding = 18
    border_size = 4
    border_color = rgba({{ accent.dec }}, 0.9)
    halign = center
    valign = center
    position = -1110, -20
}

label {
    text = cmd[update:30000] jq -r '"SUBJECT " + .subject + (if .artist != "" then " · art: " + .artist else "" end)' {{ home }}/.cache/nekosec/portrait.json 2>/dev/null
    color = $lilac
    font_size = 16
    font_family = $font
    halign = center
    valign = center
    position = -1110, -255
}

label {
    text = LAST SEEN (=ↀωↀ=)
    color = $pink
    font_size = 18
    font_family = $font
    halign = center
    valign = center
    position = -1110, 215
}

# A wrong passphrase: PAM's message under the arcs.
label {
    text = $FAIL
    color = $love
    font_size = 20
    font_family = $font
    halign = center
    valign = center
    position = 0, -505
}

label {
    text = the stone sees you, $USER  (=^･ω･^=)
    color = $lilac
    font_size = 20
    font_family = $font
    halign = center
    valign = center
    position = 0, -600
}
