# starship for the {{ theme }} theme (zsh-colors.zsh points STARSHIP_CONFIG here).
# GENERATED by `theme` from ~/dotfiles/theme/themes/nekosec/templates/starship.toml.
# A kaomoji instead of a name; it reacts to the last command (zsh sets NEKO_FACE).
add_newline = false
format = "${env_var.NEKO_FACE}$directory$git_branch$character"

[env_var.NEKO_FACE]
format = "[$env_value]($style) "
style = "bold {{ accent }}"

[directory]
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style) "
style = "bold {{ lilac }}"

[git_branch]
symbol = ""
format = "([$symbol $branch]($style)) "
style = "bold {{ mint }}"

[character]
success_symbol = "[♡](bold {{ accent }})"
error_symbol = "[♡](bold {{ love }})"
format = "$symbol "
