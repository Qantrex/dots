# nekosec: this theme's own copy of templates/cava.conf, only the gradient differs.
# cava.conf of the {{ theme }} theme. GENERATED by `theme` from
# ~/dotfiles/theme/themes/nekosec/templates/cava.conf; edit that and run `theme apply`.
## Cava Configuration - SUPER DUPER ULTRA COOL edition
# Mirrored stereo, center-split bars, dual-axis Catppuccin gradient, punchy bass.
# Previous config saved as config.bak

[general]
framerate = 144
autosens = 1
sensitivity = 120
bars = 0
bar_width = 2
bar_spacing = 1
center_align = 1
lower_cutoff_freq = 30
higher_cutoff_freq = 16000
# Stop drawing after 30s of silence (saves CPU)
sleep_timer = 30

[input]
method = pipewire
source = auto
remix = 1
virtual = 1

[output]
method = noncurses
# Stereo: left channel mirrored, bass meets in the middle
channels = stereo
reverse = 0
# Bars shoot up AND down from a center line
orientation = horizontal
synchronized_sync = 1
show_idle_bar_heads = 1

[color]
#background = transparent
# nekosec: lavender at the base, hot pink in the middle, mint at the peaks.
# (The old neon gradient is in config.neon-2026-11-12.)
gradient = 1
gradient_color_1 = '{{ lilac.mix(bg,0.55) }}'
gradient_color_2 = '{{ lilac }}'
gradient_color_3 = '{{ mix(lilac, accent, 0.5) }}'
gradient_color_4 = '{{ accent }}'
gradient_color_5 = '{{ mix(accent, rose, 0.5) }}'
gradient_color_6 = '{{ mix(rose, mint, 0.5) }}'
gradient_color_7 = '{{ mint }}'
gradient_color_8 = '{{ mix(mint, fg, 0.5) }}'

[smoothing]
# Smooth rolling hills instead of jagged spikes
monstercat = 1.5
waves = 0
# Lower = snappier, higher = smoother
noise_reduction = 0.65

[eq]
1 = 1.4  # Sub bass - BOOM
2 = 1.2  # Bass
3 = 1.0  # Low mids
4 = 0.95 # Mids
5 = 1.05 # Upper mids
6 = 1.15 # Treble sparkle
