[main]
# Iosevka Term (pacman: ttf-iosevkaterm-nerd). Narrow, so 13 here is about as
# tall as other fonts at 12 while fitting more columns.
font=IosevkaTerm Nerd Font Mono:size=13
pad=15x10

# Grey palette on true black (monochrome desktop, OLED). Only red, yellow and magenta keep
# Rosé Pine Moon colours (love, gold, iris); every other slot is a grey, readable at 4.9:1
# or better except slot 0, so untuned tools stop showing blue and teal.
[colors-dark]
# 0.75: the wallpaper still shows through, but text sits on a mostly black surface.
alpha=0.75
background=000000
foreground=e6e6e6
regular0=3d3d3d
regular1=eb6f92
regular2=c0c0c0
regular3=f6c177
regular4=8a8a8a
regular5=c4a7e7
regular6=a3a3a3
regular7=d0d0d0
bright0=7a7a7a
bright1=ff98ba
bright2=e0e0e0
bright3=ffeb9e
bright4=a8a8a8
bright5=eed0ff
bright6=c8c8c8
bright7=ffffff
urls=c4a7e7
flash=f6c177
cursor=000000 ffffff
